[project]
name = "aivis"
version = "0.1.0"
description = "Agent-facing AI brand visibility tracking CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Horton" }]
dependencies = [
  "edsl @ git+https://github.com/expectedparrot/edsl.git",
  "filelock>=3,<4",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "python-dateutil>=2,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "tenacity>=8,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1,<2"]
analysis = ["pandas>=2,<4"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.8"]

[project.scripts]
aivis = "aivis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aivis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
